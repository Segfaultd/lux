name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: lux
          POSTGRES_USER: lux
          POSTGRES_PASSWORD: lux
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lux -d lux"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      LUX_TEST_DATABASE_URL: postgres://lux:lux@127.0.0.1:5432/lux?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: go test ./...
      - run: python -m unittest discover -s tools/ida -p "test_*.py"
      - run: go vet ./...

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: go.sum
      - run: go build ./cmd/lux

  race:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: lux
          POSTGRES_USER: lux
          POSTGRES_PASSWORD: lux
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lux -d lux"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      LUX_TEST_DATABASE_URL: postgres://lux:lux@127.0.0.1:5432/lux?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: go.sum
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Enforce 90% statement coverage
        run: |
          go tool cover -func=coverage.out
          go tool cover -func=coverage.out | awk '/^total:/ { gsub("%", "", $3); if ($3 + 0 < 90) exit 1 }'
