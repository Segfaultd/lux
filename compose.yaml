services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${LUX_POSTGRES_DB:-lux}"
      POSTGRES_USER: "${LUX_POSTGRES_USER:-lux}"
      POSTGRES_PASSWORD: "${LUX_POSTGRES_PASSWORD:-lux}"
    ports:
      - "127.0.0.1:${LUX_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 15

  lux:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "1234:1234"
      - "8080:8080"
    environment:
      LUX_LUMINA_ADDR: ":1234"
      LUX_HTTP_ADDR: ":8080"
      LUX_DATABASE_URL: ""
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: "${LUX_POSTGRES_DB:-lux}"
      PGUSER: "${LUX_POSTGRES_USER:-lux}"
      PGPASSWORD: "${LUX_POSTGRES_PASSWORD:-lux}"
      PGSSLMODE: disable
      LUX_SERVER_NAME: "lux"
      LUX_USERNAME: "${LUX_USERNAME:-guest}"
      LUX_PASSWORD: "${LUX_PASSWORD:-change-me}"
      LUX_ADMIN_TOKEN: "${LUX_ADMIN_TOKEN:-change-me}"
      LUX_ALLOW_DELETES: "${LUX_ALLOW_DELETES:-false}"

volumes:
  postgres-data:
